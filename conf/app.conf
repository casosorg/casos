appname       = casos
httpport      = 20080
runmode       = dev
SessionOn     = true
copyrequestbody = true

; -- Database ---------------------------------------------------------------
driverName    = sqlite
dataSourceName=
; driverName    = mysql
; dataSourceName= hqcasdoor:1qaz2wsx=@tcp(db.casbin.com:3306)/

dbName        = casos
kineEndpoint  =

; -- Casdoor (optional) --------------------------------------------------------
; Leave casdoorEndpoint blank to use the built-in "admin" account instead.
casdoorEndpoint     =
clientId            =
clientSecret        =
casdoorOrganization =
casdoorApplication  =

; -- Outbound proxy (optional) ----
; Leave blank to use environment proxy settings or direct access.
; When set, the proxy is required for requests not matched by NO_PROXY.
socks5Proxy   =

; -- Built-in image registry mirror -----------------------------------------
; auto   = probe each canonical registry from the target worker and enable
;          only the mirrors needed by that worker (default). A worker that
;          needs one of those mirrors also gets the ghcr.io mirror App Store
;          charts pull through.
; always = always route built-in image pulls through the mirrors
; never  = always pull from the canonical registries
imageRegistryMirror = auto

; -- Helm images (optional) -------------------------------------------------
; Set true only when implicit/latest chart images must use IfNotPresent.
helmImplicitLatestPullPolicy = false
; Maximum time Helm waits for an application and its jobs to become ready.
helmInstallTimeout = 20m
; Maximum time an uninstall waits for the application, and any pre-delete hook
; job the chart ships, to go away. Defaults to helmInstallTimeout.
; helmUninstallTimeout = 20m

; -- Control plane ----------------------------------------------------------
apiserverPort = 20443
apiserverBind = 127.0.0.1
; Port of the Casbin admission and authorization webhook server.
; webhookPort = 20943
dataDir       = ./data
ingressControllerEnabled = true
serviceLBEnabled = true

; -- Let's Encrypt ----------------------------------------------------------
; CasOS answers the HTTP-01 challenge itself, so the temporary challenge Ingress
; needs a Service routing back to it. CasOS creates that Service, and the
; endpoint behind it, in the namespace of the Ingress being secured; a Service
; of this name that CasOS did not create is left untouched.
; casosServiceName = casos
; Defaults to httpport.
; casosServicePort = 20080

; -- Automatic worker node --------------------------------------------------
; At startup CasOS turns the machine it runs on into a worker node, so the
; cluster is never left without one. On Linux that is the host itself. On
; Windows it is the local WSL distribution, which CasOS installs when the host
; has none and switches to systemd (restarting WSL once when that changes
; anything).
; Set to false to manage worker nodes by hand instead.
autoEnrollLocalNode = true
