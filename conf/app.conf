appname       = casos
httpport      = 9000
runmode       = dev
SessionOn     = true
copyrequestbody = true

; -- Database ---------------------------------------------------------------
driverName    = mysql
dataSourceName= root:123456@tcp(localhost:3306)/
dbName        = casos

; -- Casdoor -------------------------------------------------------------------
casdoorEndpoint     = https://door.casdoor.com
clientId            = af6b5aa958822fb9dc33
clientSecret        = 8bc3010c1c951c8d876b1f311a901ff8deeb93bc
casdoorOrganization = casbin
casdoorApplication  = app-casibase

; -- Outbound proxy (optional) ----
socks5Proxy   = 127.0.0.1:10808

; -- Built-in image registry mirror -----------------------------------------
; auto   = probe each canonical registry from the target worker and enable
;          only the mirrors needed by that worker (default)
; always = always route built-in image pulls through the mirrors
; never  = always pull from the canonical registries
imageRegistryMirror = auto

; -- Helm images (optional) -------------------------------------------------
; Set true only when implicit/latest chart images must use IfNotPresent.
helmImplicitLatestPullPolicy = false

; -- Control plane ----------------------------------------------------------
apiserverPort = 6443
apiserverBind = 127.0.0.1
dataDir       = /var/lib/casos
ingressControllerEnabled = true
serviceLBEnabled = true
